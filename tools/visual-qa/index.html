<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>僵王崛起 · 角色动态校对</title><link rel="stylesheet" href="visual-qa.css"></head>
<body><main><header><h1>角色动态校对</h1><p>真实游戏渲染器 · 六种植物 / 五种同胞 · 此页不读取或写入冒险存档</p></header>
<section class="controls" aria-label="校对控制"><button id="play">暂停动作</button><label>状态 <select id="state"><option value="cycle">连续演示</option><option value="idle">待机 / 行走</option><option value="attack">攻击</option><option value="hit">命中</option><option value="hurt">受伤</option><option value="critical">濒危</option><option value="death">退场 / 倒地</option><option value="special">对空 / 落地 / 出土</option><option value="transition">实战衔接 · 对空退场</option></select></label><label>画风 <select id="art"><option value="story">剧情画风</option><option value="classic">原版角色</option></select></label><label>采样 <select id="sampling"><option value="soft">经典柔和</option><option value="native">直接采样对照</option></select></label><label>动作时间 <input id="time" type="range" min="0" max="1200" value="0" aria-label="动作时间"></label><output id="clock">0.00 秒</output><button id="reset">从头播放</button></section>
<p id="status" role="status">正在读取游戏素材……</p><button id="retry" hidden>重新载入素材</button><label class="seek">定格到 <input id="seek" type="number" min="0" max="12" step="0.01" value="0.60" aria-label="定格秒数"> 秒 <button id="freeze">定格</button></label><div class="board" id="plants" aria-label="全部植物动作"></div><div class="board" id="zombies" aria-label="全部僵尸动作"></div>
<section class="scene"><h2>原尺寸草坪校对</h2><div class="controls"><label>站位 <select id="arrangement"><option value="alignment">全兵种行列对齐</option><option value="formation">实际关卡阵型</option><option value="crossing">通过墓碑列</option><option value="contacts">墓碑前近身 / 高姿态</option></select></label><label><input id="grid" type="checkbox" checked>显示行列与落脚线</label></div><p>每格 80×96，前九列放置植物，第十列放置墓碑。辅助线仅用于此校对页；僵尸沿所属行连续移动。</p><canvas id="scene" width="1200" height="720" aria-label="全部角色原尺寸战场预览"></canvas></section>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>八境营救 · 四十关长线</title><link rel="stylesheet" href="rescue-design.css?v=classic-popups-20261106-compact"><link rel="stylesheet" href="update-ui.css?v=800"><link rel="stylesheet" href="classic-popups.css?v=20261106-compact"><link rel="stylesheet" href="game-window.css?v=20261106-compact"></head>
<body class="game-window-host"><main class="single-game-window" aria-label="僵王崛起游戏窗口">
<header class="play-toolbar">
 <h1 id="missionName">僵王崛起</h1><span id="energy" class="supplies">物资 150</span><span id="doctorStatus">博士 10/10</span><span id="clock">准备 60秒</span>
 <nav id="teams" class="team-icons" aria-label="选择小队"></nav>
 <button id="formationOpen" disabled>编队</button><button id="start" disabled>出发</button><button id="menuOpen" disabled>菜单</button>
</header>
<section class="battle-frame"><div class="arena-layout">
 <section id="plantEconomy" class="plant-economy" aria-label="敌方植物情报，不可种植"><div class="plant-economy-head"><h2>敌方植物</h2><span>仅情报</span></div><div class="plant-economy-bank"><div class="plant-sun-bank"><strong id="plantSunValue">500</strong></div><ul id="plantSeedCards" class="plant-seed-cards" aria-label="敌方植物费用与冷却"></ul></div></section>
 <div class="battle-stage"><canvas id="scene" width="1200" height="720" tabindex="0" aria-label="营救战场"></canvas>
  <div id="squadControls" class="scene-plaque" role="group" aria-label="同格队伍" hidden><div id="squadControlButtons"></div></div>
  <div id="actionPlaque" class="scene-plaque" role="group" aria-label="场景操作" hidden></div>
  <div id="feedback" class="scene-feedback" role="status" aria-live="polite" hidden></div>
 </div>
</div></section>
<p id="loading" role="status">正在读取草坪与同胞……</p><button id="retry" hidden>重新读取</button>
</main>
<dialog id="formation" class="classic-dialog formation-window" aria-labelledby="formationTitle">
 <h2 id="formationTitle">选择同胞</h2><div id="roster" class="formation-teams" aria-label="三队开局编组"></div>
 <div class="chooser-tray"><div id="zombieCards" class="zombie-cards" aria-label="已解救的同胞"></div><div id="cardInfo" class="card-info" aria-live="polite"></div></div>
 <footer><strong id="compositionInfo"></strong><span id="formationFeedback" role="status"></span><button id="formationCancel">取消</button><button id="formationConfirm">确认编队</button></footer>
</dialog>
<dialog id="gameOptions" class="classic-dialog game-options" aria-labelledby="gameOptionsTitle"><h2 id="gameOptionsTitle">暂停</h2><div class="menu-buttons"><button id="continueGame">继续</button><button id="restart">重新开始</button><button id="replayLetters">信件回看</button><button id="chooseLevel">选择关卡</button><button id="settingsOpen">设置</button><button id="returnHome">返回主菜单</button></div></dialog>
<dialog id="settings" class="classic-dialog small-window" aria-labelledby="settingsTitle"><h2 id="settingsTitle">设置</h2><label class="setting-choice"><input type="checkbox" id="soft">柔和动作</label><button id="fullscreen">全屏游玩</button><section data-pvz-update aria-label="版本更新"></section><button id="settingsClose">返回</button></dialog>
<dialog id="levelPicker" class="classic-dialog level-window" aria-labelledby="levelPickerTitle"><h2 id="levelPickerTitle">选择关卡</h2><div id="levelButtons" class="level-buttons"></div><button id="levelClose">返回</button></dialog>
<dialog id="storyBook" class="story-book" aria-labelledby="bookTitle"><header class="book-head"><div><p id="bookEyebrow"></p><h2 id="bookTitle"></h2></div></header><nav id="bookTabs" class="book-tabs" aria-label="信件"><button data-story-page="letter">战前来信</button><button data-story-page="rescue" hidden>门后交谈</button><button data-story-page="camp">战后回信</button><button id="replayIntro">重看序章</button></nav><div class="book-layout"><nav id="bookNav" hidden></nav><article id="bookBody" tabindex="0"></article></div><footer class="book-footer"><button id="bookClose">收好来信</button></footer></dialog>
<dialog id="outcome" class="classic-dialog result-window" aria-labelledby="outcomeTitle"><h2 id="outcomeTitle"></h2><p id="outcomeText"></p><div class="result-actions"><button id="next">下一关</button><button id="retryRound">重玩</button><button id="resultHome">返回</button></div><label id="autoRoundBox" class="auto-round"><input id="autoRound" type="checkbox" checked><span id="roundStatus"></span></label></dialog>
<script src="game-window.js?v=20261106-compact"></script><script src="build-info.js?v=800"></script><script src="update-ui.js?v=800&amp;ui=20261106-compact"></script><script src="assets-data.js?v=review-balance-20261026c"></script><script src="engine.js?v=review-balance-20261026c"></script><script src="renderer.js?v=review-balance-20261026c"></script><script src="rescue-plant-assets.js?v=review-balance-20261026c"></script><script src="rescue-design-data.js?v=review-balance-20261026c"></script><script src="rescue-story-data.js?v=review-balance-20261026c"></script><script src="battle-map-land.js?v=review-balance-20261026c"></script><script src="battle-map-water-roof.js?v=review-balance-20261026c"></script><script src="battle-map-data.js?v=review-balance-20261026c"></script><script src="terrain-unit-data.js?v=review-balance-20261026c"></script><script src="terrain-campaign-data.js?v=review-balance-20261026c"></script><script src="terrain-plant-assets.js?v=review-balance-20261026c"></script><script src="terrain-rules.js?v=review-balance-20261026c"></script><script src="terrain-campaign-setup.js?v=review-balance-20261026c"></script><script src="terrain-progress.js?v=full-review-20261106-compact"></script><script src="rescue-story-ui.js?v=classic-popups-20261106-compact"></script><script src="rescue-design-model.js?v=review-balance-20261026c"></script><script src="battle-environment.js?v=board-align-20261027e"></script><script src="rescue-design-renderer.js?v=20261106-compact"></script><script src="plant-economy-ui.js?v=20261106-compact"></script><script src="prologue-data.js?v=800"></script><script src="prologue.js?v=800"></script><script src="adventure-intro.js?v=800&amp;review=20261106-compact"></script><script src="rescue-design.js?v=800&amp;window=20261106-compact&amp;review=20261106-compact"></script></body></html>
